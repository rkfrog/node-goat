name: node-goat-ci-npm-docker

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitlab-ci*'
      - 'azure-pipelines*'
      - '.github/workflows/frogbot*'
      - '.github/workflows/jfrog-sast*'
  pull_request:
    types: 
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  pull-requests: write # for approving pull requests.
  contents: read #Ability to read the contents permission
  security-events: write # Required for uploading code scanning 

env:
  NODE_DEFAULT_VERSION: 20
  PYTHON_DEFAULT_VERSION: "3.10"
  HELM_DEFAULT_VERSION: v3.14.4
  NPM_JF_RT_REPO: ${{ vars.NPM_JF_RT_REPO }}
  DOCKER_JF_RT_REPO: ${{ vars.DOCKER_JF_RT_REPO }}
  PYPI_JF_RT_REPO: ${{ vars.PYPI_JF_RT_REPO }}
  HELM_JF_RT_REPO: ${{ vars.HELM_JF_RT_REPO }}
  JF_URL: ${{ vars.JF_URL }}
  JOB_SUMMARY: true

jobs:
  npm-docker-build-and-publish-dev:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo "The job was triggered by a ${{ github.event_name }} event."
      - name: Check out repository code 🛎️
        uses: actions/checkout@v3
      - run: |
          echo "${{ github.repository }} repository has been cloned to the runner."
      - name: List files in the repository
        run: |
          ls -la ${{ github.workspace }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_DEFAULT_VERSION }}
      - name: JFrog CLI setup 🐸
        uses: jfrog/setup-jfrog-cli@v5.0.0
        env:
          JF_URL: https://${{ vars.JF_URL }}/
          JF_PROJECT: ${{ vars.JF_PROJECT }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          oidc-provider-name: jf-github-rk 
          oidc-audience: https://github.com/rkfrog
      - name: Health check JFrog Artifactory instance 🐸
        run: |
          jf --version
          jf rt ping
          jf config show
      - name: Set JF NPM Config
        run:  |
          jf npm-config --repo-deploy=$NPM_JF_RT_REPO -repo-resolve=$NPM_JF_RT_REPO
          jf npm config set registry ${{ env.JF_URL }}/artifactory/api/npm/$NPM_JF_RT_REPO/
          jf npm config list | jq -r .registry
        env:
          JF_URL: https://${{ vars.JF_URL }}
      # - name: JFrog Curation audit 🐸
      #   run: |
      #     jf curation-audit --include-cached-packages=true
      - name: JFrog audit Secrets 🔑🐸
        run: |
          jf audit --secrets --validate-secrets true --fail false
      - name: JFrog audit - SAST 🐸
        run: |
          jf audit --sast --fail false
      - name: JFrog audit - IaC (terraform + k8s + helm) 🏗️🐸
        run: |
          jf audit --iac --fail false
      - name: Capture build version
        run: |
          echo NPM_PACKAGE_BUILD_VERSION=$(cat package.json | jq -r ."version") >> $GITHUB_ENV
          echo NPM_PACKAGE_NAME=$(cat package.json | jq -r ."name") >> $GITHUB_ENV
      - name: Install NPM dependencies
        run: |
          jf npm ci --ignore-scripts --module npm-build
      - name: NPM publish 🐸
        run: jfrog npm publish --module npm-build
      - name: Evidence Publish for NPM 🐸
        run: |
          echo '{ "actor": "${{ github.actor }}", "date": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'", "branch": "${{ github.base_ref }}", "job_id": "${{ github.job }}", "git_repo_name": "${{ github.repository }}", "git_repo_owner": "${{ github.repository_owner }}", "git_commit_hash": "${{ github.SHA }}" }' > sign_npm.json
          jf evd create \
            --package-name ${{ env.NPM_PACKAGE_NAME }} \
            --package-version ${{ env.NPM_PACKAGE_BUILD_VERSION }} \
            --package-repo-name $NPM_JF_RT_REPO  \
            --key "${{ secrets.JF_EVD_PRIVATE_KEY }}"  --key-alias evidence-signing-rk \
            --predicate ./sign_npm.json --predicate-type https://jfrog.com/evidence/signature/v1
          echo '🔎 NPM build Evidence attached: `signature` 🔏 ' >> $GITHUB_STEP_SUMMARY
      - name: Set JF Pip Config 🐍🐸
        working-directory: services/insights
        run: |
          jf pip-config --repo-resolve=$PYPI_JF_RT_REPO
      - name: JFrog Curation audit (Python) 🐍🐸
        working-directory: services/insights
        run: |
          jf curation-audit --threads=50 || true
      - name: JFrog audit (Python deps) 🐍🐸
        working-directory: services/insights
        run: |
          jf audit --fail false
      - name: Install Python dependencies via JFrog 🐍🐸
        working-directory: services/insights
        run: |
          jf pip install -r requirements.txt --module py-insights
      - name: Build Python wheel 🐍🐸
        working-directory: services/insights
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/
      - name: Upload Python wheel to Artifactory 🐍🐸
        working-directory: services/insights
        run: |
          jf rt upload "dist/*.whl" "$PYPI_JF_RT_REPO/node-goat-insights/${{ env.NPM_PACKAGE_BUILD_VERSION }}/" --module py-insights
      - name: Evidence Publish for Python 🐍🐸
        working-directory: services/insights
        run: |
          echo '{ "actor": "${{ github.actor }}", "date": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'", "branch": "${{ github.base_ref }}", "job_id": "${{ github.job }}", "git_repo_name": "${{ github.repository }}", "git_repo_owner": "${{ github.repository_owner }}", "git_commit_hash": "${{ github.SHA }}" }' > sign_python.json
          jf evd create \
            --package-name node-goat-insights \
            --package-version ${{ env.NPM_PACKAGE_BUILD_VERSION }} \
            --package-repo-name $PYPI_JF_RT_REPO \
            --key "${{ secrets.JF_EVD_PRIVATE_KEY }}" --key-alias evidence-signing-rk \
            --predicate ./sign_python.json --predicate-type https://jfrog.com/evidence/signature/v1
          echo '🔎 Python build evidence attached: `signature` 🔏' >> $GITHUB_STEP_SUMMARY
      - name: Login to JFrog Docker repo
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JF_URL }}
          username: ${{ secrets.JF_USERNAME }}
          password: ${{ secrets.JF_ACCESS_TOKEN }}
      - name: Docker Build 🐳🐸
        run: |
          echo "registry=https://${{ env.JF_URL }}/artifactory/api/npm/$NPM_JF_RT_REPO/" >> $HOME/.npmrc
          echo "//${{ env.JF_URL }}/artifactory/api/npm/$NPM_JF_RT_REPO/:_authToken=${{ env.NPM_TOKEN }}" >> $HOME/.npmrc
          jf docker image build --tag ${{ env.JF_URL }}/$DOCKER_JF_RT_REPO/node-goat:${{ env.NPM_PACKAGE_BUILD_VERSION }} --secret id=npmrc,src=$HOME/.npmrc --module docker-build  --build-arg="REGISTRY_URL=${{ env.JF_URL }}" --build-arg="DOCKER_REPO_NAME=$DOCKER_JF_RT_REPO" --build-arg="NPM_REPO_NAME=$NPM_JF_RT_REPO" .
        env:
          JF_URL: ${{ vars.JF_URL }}
          NPM_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      # - name: JFrog docker image scan 🐳🐸
      #   run: |
      #     jf docker scan ${{ env.JF_URL }}/$DOCKER_JF_RT_REPO/node-goat:${{ env.NPM_PACKAGE_BUILD_VERSION }} --format json --threads 6
      #   env:
      #     JF_URL: ${{ vars.JF_URL }}
      - name: Docker Push 🐳🐸
        run: |
          jf docker push ${{ env.JF_URL }}/$DOCKER_JF_RT_REPO/node-goat:${{ env.NPM_PACKAGE_BUILD_VERSION }} --module docker-build 
        env:
          JF_URL: ${{ vars.JF_URL }}
      - name: Evidence Publish for Docker 🐳🐸
        run: |
          echo '{ "actor": "${{ github.actor }}", "date": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'", "branch": "${{ github.base_ref }}", "job_id": "${{ github.job }}", "git_repo_name": "${{ github.repository }}", "git_repo_owner": "${{ github.repository_owner }}", "git_commit_hash": "${{ github.SHA }}" }' > sign_docker.json
          jf evd create \
            --package-name node-goat \
            --package-version ${{ env.NPM_PACKAGE_BUILD_VERSION }} \
            --package-repo-name $DOCKER_JF_RT_REPO  \
            --key "${{ secrets.JF_EVD_PRIVATE_KEY }}"  --key-alias evidence-signing-rk \
            --predicate ./sign_docker.json --predicate-type https://jfrog.com/evidence/signature/v1
          echo '🔎 Docker build evidence attached: `signature` 🔏 ' >> $GITHUB_STEP_SUMMARY
      - name: Helm chart package
        run: |
          sed -i "s/^version: .*/version: ${{ env.NPM_PACKAGE_BUILD_VERSION }}/" charts/node-goat/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ env.NPM_PACKAGE_BUILD_VERSION }}\"/" charts/node-goat/Chart.yaml
          helm package charts/node-goat --destination ./charts/dist
          ls -la ./charts/dist
      - name: Helm chart OCI push 🐸
        run: |
          echo "${{ secrets.JF_ACCESS_TOKEN }}" | helm registry login ${{ env.JF_URL }} --username ${{ secrets.JF_USERNAME }} --password-stdin
          helm push ./charts/dist/node-goat-${{ env.NPM_PACKAGE_BUILD_VERSION }}.tgz oci://${{ env.JF_URL }}/$HELM_JF_RT_REPO
      - name: Evidence Publish for Helm 🐸
        run: |
          echo '{ "actor": "${{ github.actor }}", "date": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'", "branch": "${{ github.base_ref }}", "job_id": "${{ github.job }}", "git_repo_name": "${{ github.repository }}", "git_repo_owner": "${{ github.repository_owner }}", "git_commit_hash": "${{ github.SHA }}" }' > sign_helm.json
          jf evd create \
            --package-name node-goat \
            --package-version ${{ env.NPM_PACKAGE_BUILD_VERSION }} \
            --package-repo-name $HELM_JF_RT_REPO \
            --key "${{ secrets.JF_EVD_PRIVATE_KEY }}" --key-alias evidence-signing-rk \
            --predicate ./sign_helm.json --predicate-type https://jfrog.com/evidence/signature/v1
          echo '🔎 Helm chart evidence attached: `signature` 🔏' >> $GITHUB_STEP_SUMMARY
      - name: Gather build details 🐸
        run: |
          jf rt build-add-git ./
          jf rt build-collect-env
      - name: JFrog build publish 🐸
        run: jf rt build-publish ${{ env.JFROG_CLI_BUILD_NAME }} ${{ env.JFROG_CLI_BUILD_NUMBER }} --project ${{ vars.JF_PROJECT }} --detailed-summary=true
      - name: Sign Build Evidence 🐸
        run: |
          echo '{ "actor": "${{ github.actor }}", "date": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'" }' > sign_build.json
          jf evd create \
            --predicate ./sign_build.json --predicate-type https://jfrog.com/evidence/build-signature/v1 \
            --build-name ${{ env.JFROG_CLI_BUILD_NAME }} \
            --build-number ${{ env.JFROG_CLI_BUILD_NUMBER }} \
            --project ${{ vars.JF_PROJECT }} \
            --key "${{ secrets.JF_EVD_PRIVATE_KEY }}"  --key-alias evidence-signing-rk  
          echo '🔎 Build Evidence attached: `build-signature` 🔏 ' >> $GITHUB_STEP_SUMMARY
      - name: JFrog build scan 🐸
        run: |
          sleep 60
          jf build-scan --fail=false --vuln=true ${{ env.JFROG_CLI_BUILD_NAME }} ${{ env.JFROG_CLI_BUILD_NUMBER }} --project ${{ vars.JF_PROJECT }}
      - name: JFrog create release bundle 🐸
        run: |
          jf release-bundle-create --spec=rbv2_build_spec.json --spec-vars="build-name=${{ env.JFROG_CLI_BUILD_NAME }};build-number=${{ env.JFROG_CLI_BUILD_NUMBER }};project-key=${{ vars.JF_PROJECT }}" --sync=true --signing-key=${{ secrets.JF_RB_SIGNING_KEY_NAME }} ${{ env.JFROG_CLI_BUILD_NAME }} ${{ env.NPM_PACKAGE_BUILD_VERSION }}
      - name: Sign Release Bundle Evidence 🐸
        run: |
          echo '{ "actor": "${{ github.actor }}", "date": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'" }' > sign_rb.json
          jf evd create \
            --predicate ./sign_rb.json --predicate-type https://jfrog.com/evidence/build-signature/v1 \
            --release-bundle  ${{ env.JFROG_CLI_BUILD_NAME }} \
            --release-bundle-version ${{ env.NPM_PACKAGE_BUILD_VERSION }} \
            --project ${{ vars.JF_PROJECT }} \
            --key "${{ secrets.JF_EVD_PRIVATE_KEY }}"  --key-alias evidence-signing-rk  
          echo '🔎 Release Bundle Evidence attached: `release-bundle-signature` 🔏 ' >> $GITHUB_STEP_SUMMARY