name: "Frogbot Security Scan"

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitlab-ci*'
      - 'azure-pipelines*'
      - '.github/workflows/*'
      - 'scripts/*'
      - 'docs/*'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  pull-requests: write # for approving pull requests.
  contents: read #Ability to read the contents permission
  security-events: write # Required for uploading code scanning 
  

jobs:
  scan-repository:
    environment: "solenglatest"
    runs-on: ubuntu-latest
    name: Scan Repository
    steps:
      - uses: actions/checkout@v4
      - uses: jfrog/frogbot@v3
        env:
          JF_URL: https://${{ vars.JF_URL }}/
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
          JF_GIT_BASE_BRANCH: ${{ github.ref_name }}
        with:
          oidc-provider-name: jf-github-rk 
          oidc-audience: https://github.com/rkfrog