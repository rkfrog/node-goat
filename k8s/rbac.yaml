apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-goat
  namespace: node-goat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-goat-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: node-goat
    namespace: node-goat
