[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "node-goat-insights"
version = "0.1.0"
description = "Insights sidecar for NodeGoat (JFrog platform demo). Intentionally vulnerable."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "JFrog SolEng" }]
dependencies = [
  "Flask==1.0.0",
  "requests==2.19.1",
  "urllib3==1.24.1",
  "PyYAML==5.1",
  "Jinja2==2.10",
  "Werkzeug==0.14.1",
  "itsdangerous==0.24",
  "cryptography==2.3",
  "paramiko==2.4.1",
  "pyjwt==1.5.0",
  "lxml==4.6.2",
]

[project.scripts]
node-goat-insights = "insights.app:main"
