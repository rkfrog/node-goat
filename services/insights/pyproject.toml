[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "node-goat-insights"
dynamic = ["version"]
description = "Insights sidecar for NodeGoat (JFrog platform demo). Intentionally vulnerable."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "JFrog SolEng" }]
dependencies = [
  "Flask==2.2.2",
  "Werkzeug==2.2.2",
  "Jinja2==3.1.2",
  "itsdangerous==2.1.2",
  "MarkupSafe==2.1.1",
  "requests==2.30.0",
  "urllib3==1.26.5",
  "aiohttp==3.8.3",
  "cryptography==41.0.0",
  "paramiko==3.0.0",
  "PyJWT==2.4.0",
  "PyYAML==5.3.1",
  "lxml==4.9.1",
  "Pillow==9.0.0",
  "gunicorn==20.0.4",
  "SQLAlchemy==1.4.41",
]

[project.scripts]
node-goat-insights = "insights.app:main"

[tool.setuptools.dynamic]
version = { attr = "insights._version.__version__" }
